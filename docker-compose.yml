# 指纹识别系统 —— 一键启动编排
#
#   docker compose up --build
#
# 设计说明（对应「生产级部署」的几个关注点）：
#
#   1. 容器间访问收敛
#      client 通过服务名 http://server:8080 访问 server，走 compose 内部网络，
#      服务间流量不出宿主机。宿主机仅把 server 端口绑定在回环地址 127.0.0.1 上，
#      便于本地用 curl 验证，但不对局域网暴露。client 不暴露任何端口。
#
#   2. 启动依赖的真实健康检测
#      client 使用 depends_on.condition: service_healthy，等待 server 真正健康
#      才启动，而不是仅等待容器「已创建」。健康检查调用的是二进制自带的
#      healthcheck 子命令 —— 因为运行镜像是 distroless，没有 shell/curl/wget。
#
#   3. 规则与代码解耦
#      规则文件以只读卷挂载到 /etc/fingerprint/rules.yaml，并通过
#      FINGERPRINT_RULES 指向它。改规则只需改宿主机文件并重启容器，无需重建镜像。
#
#   4. 运行权限收紧
#      两个服务都启用 read_only 根文件系统、丢弃全部 Linux capabilities、
#      禁止提权（no-new-privileges），并以 nonroot 用户运行。

name: banner-fingerprint

services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    image: banner-fingerprint-server:local
    environment:
      FINGERPRINT_PORT: "8080"
      # 指向下方挂载的外部规则文件；文件不可用时程序会自动回退内置规则。
      FINGERPRINT_RULES: /etc/fingerprint/rules.yaml
      LOG_LEVEL: "info"
    volumes:
      # 只读挂载规则：不改镜像即可调整识别规则。
      - ./internal/rules/rules.yaml:/etc/fingerprint/rules.yaml:ro
    # 仅绑定回环地址，避免对外暴露；容器间访问不受影响。
    # 宿主端口可通过 SERVER_HOST_PORT 覆盖，避免与本机已占用端口冲突。
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"
    networks:
      - backend
    healthcheck:
      # distroless 无 shell，这里用 exec 形式直接调用二进制子命令。
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    read_only: true
    user: nonroot:nonroot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  client:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    image: banner-fingerprint-client:local
    environment:
      SERVER_URL: http://server:8080
      REQUEST_TIMEOUT: 10s
    volumes:
      # 输入数据以只读卷提供，镜像因此保持通用：换数据不用重建。
      - ./testdata:/data:ro
    command: ["-file", "/data/input.json"]
    depends_on:
      server:
        # 真实健康依赖：server 通过健康检查后 client 才会启动。
        condition: service_healthy
    networks:
      - backend
    read_only: true
    user: nonroot:nonroot
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  backend:
    driver: bridge
