# Banner 指纹识别规则集
#
# 这是系统的「大脑」：程序本身不含任何硬编码指纹，全部识别能力由本文件描述。
# 运行时可通过环境变量 FINGERPRINT_RULES 指向外部同名文件覆盖本规则集，
# 从而实现「不改代码、不重建镜像」扩展识别能力。
#
# 字段说明：
#   id            规则唯一标识
#   protocol      命中后返回的协议名
#   product       命中后返回的软件名（留空表示只识别到协议）
#   priority      匹配优先级，越大越先匹配，命中即返回
#   ports         该服务的典型端口（弱提示：未命中会小幅下调置信度，不会否决）
#   banner        特征正则列表，任意一条命中即算命中
#   version_regex 提取版本号的正则，必须含一个捕获组
#   os_regex      提取操作系统线索的正则，必须含一个捕获组
#   confidence    基础置信度，取值 [0,1]
#
# 注意：本文件使用单引号字符串，反斜杠按字面量处理，因此
# '\x00'、'\n'、'\d' 等写法可原样作为正则表达式使用。
# banner 在匹配前会被 engine 归一化：字面量 \xNN / \n / \r 会被还原为真实字节。

version: 1

rules:
  # ------------------------------------------------------------------
  # SSH
  # 典型 banner: "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3"
  # ------------------------------------------------------------------
  - id: ssh-openssh
    protocol: SSH
    product: OpenSSH
    priority: 100
    ports: [22, 2222]
    banner:
      - '^SSH-\d+\.\d+-OpenSSH'
    version_regex: '^SSH-[\d.]+-OpenSSH_(\S+)'
    os_regex: '(Ubuntu|Debian|CentOS|Red Hat|Fedora|SUSE|Alpine|FreeBSD|Raspbian|Windows|Gentoo|Arch)'
    confidence: 0.95

  # 兜底：能确认是 SSH，但认不出具体实现。
  - id: ssh-generic
    protocol: SSH
    product: ''
    priority: 50
    ports: [22, 2222]
    banner:
      - '^SSH-\d+\.\d+-'
    confidence: 0.6

  # ------------------------------------------------------------------
  # HTTP —— 产品从 Server 响应头中提取
  # 典型 banner: "HTTP/1.1 200 OK\r\nServer: nginx/1.24.0\r\nContent-Type: text/html"
  # ------------------------------------------------------------------
  - id: http-nginx
    protocol: HTTP
    product: nginx
    priority: 100
    ports: [80, 443, 8000, 8080, 8443, 8888]
    banner:
      - '(?im)^Server:\s*nginx[/ ]'
    version_regex: '(?im)^Server:\s*nginx/([\d.]+)'
    os_regex: '\((Ubuntu|Debian|CentOS|Red Hat|Alpine|Windows|FreeBSD)\)'
    confidence: 0.9

  - id: http-apache
    protocol: HTTP
    product: Apache
    priority: 100
    ports: [80, 443, 8000, 8080, 8443, 8888]
    banner:
      - '(?im)^Server:\s*Apache[/ ]'
    version_regex: '(?im)^Server:\s*Apache/([\d.]+)'
    os_regex: '\((Ubuntu|Debian|CentOS|Red Hat|Alpine|Windows|FreeBSD)\)'
    confidence: 0.9

  - id: http-jetty
    protocol: HTTP
    product: Jetty
    priority: 100
    ports: [80, 443, 8000, 8080, 8443, 8888]
    banner:
      - '(?im)^Server:\s*Jetty[/ ]'
    version_regex: '(?im)^Server:\s*Jetty/([\d.]+)'
    confidence: 0.85

  - id: http-iis
    protocol: HTTP
    product: IIS
    priority: 100
    ports: [80, 443, 8000, 8080, 8443, 8888]
    banner:
      - '(?im)^Server:\s*Microsoft-IIS[/ ]'
    version_regex: '(?im)^Server:\s*Microsoft-IIS/([\d.]+)'
    confidence: 0.9

  # 兜底：只认出是 HTTP，认不出具体服务端软件。
  - id: http-generic
    protocol: HTTP
    product: ''
    priority: 30
    ports: [80, 443, 8000, 8080, 8443, 8888]
    banner:
      - '(?m)^HTTP/\d(?:\.\d)?\s+\d{3}'
    confidence: 0.5

  # ------------------------------------------------------------------
  # MySQL
  # 服务端握手包（二进制）：[3字节长度][1字节序号][\x0a][版本串]\x00
  # 典型 banner: "J\x00\x00\x00\n8.0.32\x00"
  # 归一化后会变成真实字节，因此正则按字节序写。
  # ------------------------------------------------------------------
  - id: mysql
    protocol: MySQL
    product: MySQL
    priority: 100
    ports: [3306, 3307]
    banner:
      - '\x00\x00\x00\n\d+\.\d+\.\d+\x00'
    version_regex: '\x00\x00\x00\n([\d.]+)\x00'
    confidence: 0.9

  # ------------------------------------------------------------------
  # Redis —— RESP 协议，无版本信息
  # 典型 banner: "-ERR wrong number of arguments for 'get' command"
  #              "+PONG"
  #              "-NOAUTH Authentication required."
  # ------------------------------------------------------------------
  - id: redis
    protocol: Redis
    product: Redis
    priority: 100
    ports: [6379, 6380]
    banner:
      - '^\+PONG'
      - '^-ERR\b'
      - '^-NOAUTH\b'
      - '^-WRONGTYPE\b'
      - '^-MOVED\b'
      - '^-ASK\b'
      - '^-LOADING\b'
      - '^-MISCONF\b'
    confidence: 0.7

  # ------------------------------------------------------------------
  # FTP
  # 典型 banner: "220 ProFTPD 1.3.7 Server (ProFTPD)"
  #              "220 (vsFTPd 3.0.5)"
  #              "220 Welcome to Pure-FTPd"
  # ------------------------------------------------------------------
  - id: ftp-proftpd
    protocol: FTP
    product: ProFTPD
    priority: 100
    ports: [21, 2121]
    banner:
      - '^220[ -].*ProFTPD'
    version_regex: 'ProFTPD[/ ]([\d.]+)'
    confidence: 0.9

  - id: ftp-vsftpd
    protocol: FTP
    product: vsFTPd
    priority: 100
    ports: [21, 2121]
    banner:
      - '^220.*vsFTPd'
    version_regex: 'vsFTPd\s+([\d.]+)'
    confidence: 0.9

  - id: ftp-pure-ftpd
    protocol: FTP
    product: Pure-FTPd
    priority: 100
    ports: [21, 2121]
    banner:
      - '^220.*Pure-FTPd'
    confidence: 0.9

  # 兜底：能确认是 FTP（220 应答码），但认不出具体实现。
  - id: ftp-generic
    protocol: FTP
    product: ''
    priority: 40
    ports: [21, 2121]
    banner:
      - '^220[ -]'
    confidence: 0.6
